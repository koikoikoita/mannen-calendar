<script>
'use strict';
const MAX_YEAR=12026, MIN_YEAR=1;
let viewYear=new Date().getFullYear(), viewMonth=new Date().getMonth()+1, lang='ja';
const JP_DOW=['日','月','火','水','木','金','土'];
const EN_DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ROKUYO_JA=['先勝','友引','先負','仏滅','大安','赤口'];
const ROKUYO_EN=['Sensho','Tomobiki','Senbu','Butsumetsu','Taian','Shakko'];
const HOLIDAY_EN={
'元日':"New Year's Day",'成人の日':'Coming of Age Day','建国記念の日':'National Foundation Day','天皇誕生日':"Emperor's Birthday",'春分の日':'Vernal Equinox Day','昭和の日':'Showa Day','憲法記念日':'Constitution Memorial Day','みどりの日':'Greenery Day','こどもの日':"Children's Day",'海の日':'Marine Day','山の日':'Mountain Day','敬老の日':'Respect for the Aged Day','秋分の日':'Autumnal Equinox Day','スポーツの日':'Sports Day','文化の日':'Culture Day','勤労感謝の日':'Labor Thanksgiving Day','国民の休日':"Citizen's Holiday",'振替休日':'Substitute Holiday'};
const TEXT={
ja:{title:'万年カレンダー｜六曜・祝日対応・1万年先まで検索',displayTitle:'万年カレンダー',intro:'六曜と日本の祝日を見ながら、西暦1年から12026年まで検索できるシンプルなカレンダーです。',share:'共有',copy:'URLをコピー',copied:'コピーしました',switch:'English',add1:'1ヶ月後',add2:'2ヶ月後',add3:'3ヶ月後',nextYear:'1年後',today:'今月',year:'西暦',month:'月',show:'表示',note:'※ 3ヶ月分を常時表示します。表示可能範囲は西暦1年〜12026年です。祝日は、現在の日本の祝日制度を将来にも適用した「参考表示」です。将来の法改正、天皇誕生日、臨時の祝日等は事前に確定できません。六曜は旧暦の月日を基準とする暦注です。本サイトの超長期表示では天文近似による旧暦推定を用いるため、遠い将来ほど実際の暦と一致する保証はありません。',privacy:'このページは入力内容を外部へ送信しません。アクセス解析・広告・Cookie・個人情報入力欄はありません。',about:`<h2>万年カレンダーでできること</h2><div class="feature-grid"><div class="feature"><b>3か月を一度に表示</b><br>前後の予定を見比べやすいよう、常に3か月分を表示します。</div><div class="feature"><b>六曜・祝日を確認</b><br>大安・仏滅などの六曜と、日本の祝日を日付ごとに表示します。</div><div class="feature"><b>遠い未来も検索</b><br>西暦1年から12026年まで、年と月を指定して表示できます。</div></div><h3>使い方</h3><p>「1ヶ月後」「2ヶ月後」「3ヶ月後」「1年後」のボタン、または年・月の指定から目的のカレンダーを表示できます。右上のボタンで日本語と英語を切り替えられます。</p>`,guide:`<h2>六曜について</h2><p>六曜は、日本の暦に受け継がれてきた六つの暦注です。日の吉凶を表す伝統的な目安として親しまれてきましたが、科学的な因果関係を示すものではありません。文化として楽しみながら、日々に少しだけ暦の趣を添えるものとしてご覧ください。</p><div class="rokuyo-grid"><div class="rokuyo-item"><b>先勝</b><span>「先んずれば勝つ」。一般に午前が吉、午後は慎む日とされます。</span></div><div class="rokuyo-item"><b>友引</b><span>勝負がつかない日という解釈から転じ、慶事に選ばれることがあります。</span></div><div class="rokuyo-item"><b>先負</b><span>「先んずれば負ける」。急がず静かに過ごす日とされます。</span></div><div class="rokuyo-item"><b>仏滅</b><span>六曜の中で凶とされる日。仏教そのものとの直接的な関係はありません。</span></div><div class="rokuyo-item"><b>大安</b><span>「大いに安し」。万事に吉とされ、祝い事に好まれます。</span></div><div class="rokuyo-item"><b>赤口</b><span>正午前後を除き慎む日とされ、火や刃物への注意を説く俗信もあります。</span></div></div>`},
en:{title:'The Eternal Calendar | Japanese Rokuyo & Holidays',displayTitle:'The Eternal Calendar',intro:'A simple calendar for exploring dates from CE 1 to 12026, with Japanese Rokuyo and national holidays.',share:'Share',copy:'Copy URL',copied:'Copied',switch:'日本語',add1:'+1 month',add2:'+2 months',add3:'+3 months',nextYear:'+1 year',today:'This month',year:'Year',month:'Month',show:'Show',note:'Displays three months at all times. Supported range: CE 1–12026. Japanese national holidays in very distant years are shown only as a reference by extending the present-day rules; future laws, imperial birthdays, and one-time holidays cannot be known in advance. Rokuyo is traditionally assigned from dates in the old lunisolar calendar. For extremely distant years, this site uses astronomical approximations, so exact agreement with future historical calendars cannot be guaranteed.',privacy:'This page does not send your entries outside the browser. It uses no analytics, advertising, cookies, or personal-information fields.',about:`<h2>What You Can Do</h2><div class="feature-grid"><div class="feature"><b>View three months at once</b><br>Three consecutive months are always shown for easy planning.</div><div class="feature"><b>See Rokuyo and holidays</b><br>Each date can show its traditional Rokuyo sign and Japanese national holiday.</div><div class="feature"><b>Explore distant years</b><br>Jump to any month from CE 1 through 12026.</div></div><h3>How to use</h3><p>Use the quick-jump buttons or enter a year and month directly. The language button switches the interface between Japanese and English.</p>`,guide:`<h2>Rokuyo — Six Traditional Signs of the Day</h2><p>Rokuyo is a cycle of six traditional calendar annotations long woven into everyday life in Japan. Each name carries an old sense of timing, fortune, and restraint. They are not scientific predictions and do not cause events; rather, they belong to the cultural poetry of the calendar — a quiet way people have used to give character to a day, especially when choosing dates for ceremonies and milestones.</p><p>Their appeal can feel mysterious because the same six signs return again and again through the old lunisolar rhythm, connecting an ordinary date with a much older way of reading time.</p><div class="rokuyo-grid"><div class="rokuyo-item"><b>Sensho 先勝</b><span>“Victory comes to those who act first.” Traditionally regarded as favorable in the morning and less favorable later in the day.</span></div><div class="rokuyo-item"><b>Tomobiki 友引</b><span>Literally evokes “drawing a friend along.” Often regarded as suitable for celebrations, while funerals are traditionally avoided on this day.</span></div><div class="rokuyo-item"><b>Senbu 先負</b><span>“The one who acts first loses.” A day traditionally associated with patience, calm, and avoiding haste.</span></div><div class="rokuyo-item"><b>Butsumetsu 仏滅</b><span>Traditionally considered the least auspicious of the six. Despite the characters, Rokuyo is not a doctrine of Buddhism.</span></div><div class="rokuyo-item"><b>Taian 大安</b><span>“Great peace.” Traditionally regarded as the most auspicious sign and especially popular for weddings and celebrations.</span></div><div class="rokuyo-item"><b>Shakko 赤口</b><span>A day traditionally treated with caution, except around midday. Folk custom also associates it with care around fire and sharp objects.</span></div></div>`}
};
function mod(a,b){return ((a%b)+b)%b}
function isLeap(y){return y%4===0&&(y%100!==0||y%400===0)}
function dim(y,m){return [31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1]}
function jdn(y,m,d){let a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}
function dow(y,m,d){return mod(jdn(y,m,d)+1,7)}
function nthWeekday(y,m,weekday,n){let first=dow(y,m,1);return 1+mod(weekday-first,7)+7*(n-1)}
function approxEquinoxDay(y,spring){const jd0=jdn(y,spring?3:9,spring?20:22);let jd=jd0;for(let i=0;i<8;i++){const T=(jd-2451545.0)/36525;const L0=mod(280.46646+36000.76983*T+0.0003032*T*T,360);const M=mod(357.52911+35999.05029*T-0.0001537*T*T,360)*Math.PI/180;const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);let lambda=mod(L0+C,360),target=spring?0:180;let diff=mod(lambda-target+180,360)-180;jd-=diff/0.98564736}return (spring?20:22)+Math.round((jd+9/24)-jd0)}
function holidaysBase(y){let h={};const add=(m,d,n)=>{if(d>=1&&d<=dim(y,m))h[`${m}-${d}`]=n};add(1,1,'元日');add(1,nthWeekday(y,1,1,2),'成人の日');add(2,11,'建国記念の日');add(2,23,'天皇誕生日');add(3,approxEquinoxDay(y,true),'春分の日');add(4,29,'昭和の日');add(5,3,'憲法記念日');add(5,4,'みどりの日');add(5,5,'こどもの日');add(7,nthWeekday(y,7,1,3),'海の日');add(8,11,'山の日');add(9,nthWeekday(y,9,1,3),'敬老の日');add(9,approxEquinoxDay(y,false),'秋分の日');add(10,nthWeekday(y,10,1,2),'スポーツの日');add(11,3,'文化の日');add(11,23,'勤労感謝の日');return h}
function holidayMap(y){let h=holidaysBase(y);for(let m=1;m<=12;m++)for(let d=2;d<dim(y,m);d++){let k=`${m}-${d}`;if(h[k])continue;let p=jdn(y,m,d)-1,n=jdn(y,m,d)+1;let prev=findByJdn(y,p,h),next=findByJdn(y,n,h);if(prev&&next)h[k]='国民の休日'}let entries=[];for(const k of Object.keys(h)){let [m,d]=k.split('-').map(Number);entries.push([jdn(y,m,d),m,d])}entries.sort((a,b)=>a[0]-b[0]);for(const [jd,m,d] of entries){if(dow(y,m,d)===0){let x=jd+1,g;while((g=gregFromJdn(x)).y===y){let key=`${g.m}-${g.d}`;if(!h[key]){h[key]='振替休日';break}x++}}}return h}
function findByJdn(y,jd,h){let g=gregFromJdn(jd);return g.y===y&&h[`${g.m}-${g.d}`]}
function gregFromJdn(J){let a=J+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153);return {d:e-Math.floor((153*m+2)/5)+1,m:m+3-12*Math.floor(m/10),y:100*b+d-4800+Math.floor(m/10)}}
function approxLunarDate(y,m,d){const jd=jdn(y,m,d)-0.5,syn=29.530588853,epoch=2451550.25972;let k=Math.floor((jd-epoch)/syn),nm=epoch+k*syn;if(nm>jd){k--;nm-=syn}let lunarDay=Math.floor(jd-nm)+1;if(lunarDay<1)lunarDay=1;if(lunarDay>30)lunarDay=30;const mid=nm+14.765,T=(mid-2451545)/36525,L=mod(280.46646+36000.76983*T,360);let lunarMonth=mod(Math.floor((L+15)/30)+10,12)+1;return {month:lunarMonth,day:lunarDay}}
function rokuyoIndex(y,m,d){let l=approxLunarDate(y,m,d);return mod(l.month+l.day-2,6)}
function normalize(y,m){while(m>12){m-=12;y++}while(m<1){m+=12;y--}return {y,m}}
function monthTitle(y,m){if(lang==='ja')return `${y}年 ${m}月`;return new Intl.DateTimeFormat('en-US',{month:'long'}).format(new Date(2000,m-1,1))+` ${y}`}
function renderMonth(y,m){const h=holidayMap(y),first=dow(y,m,1),days=dim(y,m),dows=lang==='ja'?JP_DOW:EN_DOW;let html=`<section class="month-card"><div class="month-title">${monthTitle(y,m)}</div><table><thead><tr>`;for(let i=0;i<7;i++)html+=`<th class="${i===0?'sun':i===6?'sat':''}">${dows[i]}</th>`;html+='</tr></thead><tbody>';let cell=0;for(let r=0;r<6;r++){html+='<tr>';for(let c=0;c<7;c++,cell++){let day=cell-first+1;if(day<1||day>days){html+='<td class="empty"></td>';continue}let hn=h[`${m}-${day}`]||'',cls=c===0?'sun':c===6?'sat':'';if(hn)cls+=' holiday';let n=new Date();if(y===n.getFullYear()&&m===n.getMonth()+1&&day===n.getDate())cls+=' today';let ri=rokuyoIndex(y,m,day),rn=lang==='ja'?ROKUYO_JA[ri]:`${ROKUYO_EN[ri]} ${ROKUYO_JA[ri]}`,holidayText=lang==='ja'?hn:(HOLIDAY_EN[hn]||hn);html+=`<td class="${cls}"><div class="day">${day}</div><div class="rokuyo">${rn}</div>${hn?`<div class="holiday-name">${holidayText}</div>`:''}</td>`}html+='</tr>';if(cell-first>=days)break}return html+'</tbody></table></section>'}
function applyLanguage(){const t=TEXT[lang];document.documentElement.lang=lang;document.title=t.title;document.getElementById('siteTitle').textContent=t.displayTitle;document.getElementById('introText').textContent=t.intro;document.getElementById('shareBtn').textContent=t.share;document.getElementById('copyBtn').textContent=t.copy;document.getElementById('langBtn').textContent=t.switch;document.getElementById('add1').textContent=t.add1;document.getElementById('add2').textContent=t.add2;document.getElementById('add3').textContent=t.add3;document.getElementById('nextYear').textContent=t.nextYear;document.getElementById('todayBtn').textContent=t.today;document.getElementById('yearLabel').childNodes[0].nodeValue=t.year+' ';document.getElementById('monthLabel').childNodes[0].nodeValue=t.month+' ';document.getElementById('jumpBtn').textContent=t.show;document.getElementById('aboutSection').innerHTML=t.about;document.getElementById('rokuyoGuide').innerHTML=t.guide;document.getElementById('note').textContent=t.note;document.getElementById('privacy').textContent=t.privacy;render()}
function render(){let out='';for(let i=0;i<3;i++){let z=normalize(viewYear,viewMonth+i);if(z.y<MIN_YEAR||z.y>MAX_YEAR)continue;out+=renderMonth(z.y,z.m)}document.getElementById('calendars').innerHTML=out;document.getElementById('yearInput').value=viewYear;document.getElementById('monthInput').value=viewMonth}
function setView(y,m){let z=normalize(y,m);viewYear=Math.min(MAX_YEAR,Math.max(MIN_YEAR,z.y));viewMonth=z.m;render()}
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>setView(viewYear,viewMonth+Number(b.dataset.add))));
document.getElementById('nextYear').onclick=()=>setView(viewYear+1,viewMonth);document.getElementById('todayBtn').onclick=()=>{let n=new Date();setView(n.getFullYear(),n.getMonth()+1)};document.getElementById('jumpBtn').onclick=()=>{let y=Number(document.getElementById('yearInput').value),m=Number(document.getElementById('monthInput').value);if(Number.isInteger(y)&&Number.isInteger(m)&&y>=MIN_YEAR&&y<=MAX_YEAR&&m>=1&&m<=12)setView(y,m);else alert(lang==='ja'?`西暦${MIN_YEAR}年〜${MAX_YEAR}年、1〜12月を入力してください。`:`Enter a year from ${MIN_YEAR} to ${MAX_YEAR} and a month from 1 to 12.`)};
document.getElementById('langBtn').onclick=()=>{lang=lang==='ja'?'en':'ja';applyLanguage()};
function currentUrl(){const u=new URL(location.href);u.searchParams.set('y',viewYear);u.searchParams.set('m',viewMonth);if(lang==='en')u.searchParams.set('lang','en');else u.searchParams.delete('lang');return u.toString()}
document.getElementById('shareBtn').onclick=async()=>{const url=currentUrl();try{if(navigator.share)await navigator.share({title:TEXT[lang].displayTitle,url});else{await navigator.clipboard.writeText(url);alert(TEXT[lang].copied)}}catch(e){}};
document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(currentUrl());alert(TEXT[lang].copied)}catch(e){}};
(()=>{const p=new URLSearchParams(location.search),y=Number(p.get('y')),m=Number(p.get('m'));if(p.get('lang')==='en')lang='en';if(Number.isInteger(y)&&Number.isInteger(m)&&y>=MIN_YEAR&&y<=MAX_YEAR&&m>=1&&m<=12){viewYear=y;viewMonth=m}})();
applyLanguage();
</script></body></html>
